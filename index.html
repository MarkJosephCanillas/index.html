<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCash • Secure Login</title>
  <style>
    /* ----- RESET & BASE (clean, minimalist) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f9ff;
      padding: 1.5rem;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, #e2f0fa 0%, #f5f9ff 80%);
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }

    /* ----- MAIN CARD ----- */
    .card {
      position: relative;
      z-index: 10;
      background: #ffffff;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border-radius: 40px;
      padding: 2.5rem 2rem 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 
        0 20px 40px -12px rgba(0, 40, 60, 0.12),
        0 8px 24px -6px rgba(0, 80, 120, 0.05);
      border: 1px solid rgba(128, 200, 210, 0.20);
      transition: box-shadow 0.25s ease;
    }

    .card:hover {
      box-shadow: 0 30px 50px -18px rgba(0, 90, 110, 0.18);
    }

    /* ----- BRAND ----- */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.8rem;
      justify-content: center;
    }

    .brand-icon {
      background: #4dd0e1;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 600;
      color: white;
      box-shadow: 0 6px 14px rgba(77, 208, 225, 0.30);
    }

    .brand-text {
      font-size: 1.9rem;
      font-weight: 600;
      color: #1a2e3f;
      letter-spacing: -0.4px;
    }
    .brand-text span {
      color: #4dd0e1;
      font-weight: 300;
    }

    /* ----- "Secure" badge (no lock) ----- */
    .secure-badge {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      background: #eef8fa;
      border: 1px solid #c4e6ec;
      border-radius: 60px;
      padding: 0.35rem 1.4rem;
      width: fit-content;
      margin: 0 auto 2rem auto;
      color: #1f5f6b;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .secure-badge i {
      font-style: normal;
      font-size: 1rem;
    }

    /* ----- FORM FIELDS (empty, no hints, no visible credentials) ----- */
    .input-group {
      margin-bottom: 1.4rem;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #2a4b5a;
      letter-spacing: 0.4px;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .input-group input {
      width: 100%;
      background: #f8fbfc;
      border: 1px solid #dae9ed;
      border-radius: 28px;
      padding: 0.9rem 1.4rem;
      font-size: 1rem;
      color: #14242e;
      outline: none;
      transition: 0.2s;
      font-weight: 400;
    }

    .input-group input:focus {
      border-color: #4dd0e1;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(77, 208, 225, 0.12);
    }

    .input-group input::placeholder {
      color: #a8c2cc;
      font-weight: 300;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .input-group input[type="password"] {
      letter-spacing: 3px;
      font-weight: 400;
    }

    /* hide any hint text */
    .input-hint {
      display: none;
    }

    /* ----- LOGIN BUTTON (no lock icon) ----- */
    .action-btn {
      width: 100%;
      background: #4dd0e1;
      border: none;
      padding: 1rem 1.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #0a242e;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s ease;
      margin: 1.4rem 0 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      letter-spacing: 0.2px;
      box-shadow: 0 6px 18px rgba(77, 208, 225, 0.30);
    }

    .action-btn:hover {
      background: #3ec4d6;
      transform: scale(1.01);
      box-shadow: 0 10px 28px rgba(77, 208, 225, 0.40);
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn.hidden {
      display: none;
    }

    /* ----- POPUP / ACCOUNT SAVED (no phishing mention) ----- */
    .popup-message {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: scale(0.96) translateY(8px);
      transition: max-height 0.45s ease, opacity 0.4s ease, transform 0.35s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      margin-top: 0.2rem;
    }

    .popup-message.show {
      max-height: 600px;
      opacity: 1;
      transform: scale(1) translateY(0);
      margin-top: 1.2rem;
    }

    /* ----- "Account Saved" success card (replaces phishing alert) ----- */
    .success-alert {
      background: #e3f5ec;
      border: 1px solid #8fd0b2;
      border-radius: 60px;
      padding: 0.9rem 1.8rem;
      color: #1a6e4a;
      font-weight: 600;
      font-size: 1rem;
      width: 100%;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(77, 208, 150, 0.15);
    }
    .success-alert .icon {
      font-size: 1.4rem;
    }

    .fake-data {
      background: #f9fcfe;
      border-radius: 32px;
      padding: 0.9rem 1.4rem;
      width: 100%;
      border: 1px solid #ddeef2;
      color: #1d3742;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .fake-data .row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #e5f0f4;
      padding: 0.4rem 0;
    }
    .fake-data .row:last-child {
      border-bottom: none;
    }
    .fake-data .label {
      color: #547a88;
      font-weight: 400;
    }
    .fake-data .value {
      color: #0b2c39;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .footnote {
      margin-top: 1.8rem;
      font-size: 0.6rem;
      color: #90b2be;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-align: center;
      border-top: 1px solid #e5f0f4;
      padding-top: 1.2rem;
      opacity: 0.6;
    }

    .ed-label {
      font-size: 0.65rem;
      color: #6d9aaa;
      background: #f0f8fa;
      padding: 0.25rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #d0e8ee;
    }

    @media (max-width: 460px) {
      .card { padding: 2rem 1.2rem; border-radius: 32px; }
      .brand-text { font-size: 1.6rem; }
      .action-btn { font-size: 1rem; padding: 0.9rem 1rem; }
      .success-alert { font-size: 0.9rem; padding: 0.7rem 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- brand header -->
    <div class="brand">
      <div class="brand-icon">₱</div>
      <div class="brand-text">GCash<span> •</span></div>
    </div>

    <div class="secure-badge">
      <i>🛡️</i> 256‑bit encrypted • 
    </div>

    <!-- ===== LOGIN FORM ===== -->
    <!-- All fields are TOTALLY EMPTY — no value, no placeholder text, no hints.
         The authorized user (Jovaira Andago, 1234, 09123456789) is known only to the customer,
         and is NOT displayed anywhere on the page.
    -->
    <div class="input-group">
      <label>📛 Full Name</label>
      <input type="text" id="fullName" placeholder="" value="" />
    </div>

    <div class="input-group">
      <label>🔑 MPIN (6 digits)</label>
      <input type="password" id="mpin" placeholder="" maxlength="6" value="" />
    </div>

    <div class="input-group">
      <label>📱 Account Number</label>
      <input type="text" id="accountNum" placeholder="" value="" />
    </div>

    <!-- Login button: NO lock icon -->
    <button class="action-btn" id="phishBtn">
      <span>▶</span> Login to GCash
    </button>

    <!-- ===== "ACCOUNT SAVED" POPUP (no phishing mention) ===== -->
    <div class="popup-message" id="popupMessage">

      <div class="success-alert">
        <span class="icon">✅</span> Account Saved
      </div>

      <div class="fake-data">
        <div class="row">
          <span class="label">📛 Name</span>
          <span class="value" id="displayName">—</span>
        </div>
        <div class="row">
          <span class="label">🔑 MPIN</span>
          <span class="value" id="displayMpin">—</span>
        </div>
        <div class="row">
          <span class="label">📱 Account</span>
          <span class="value" id="displayAccount">—</span>
        </div>
      </div>

      <div class="ed-label">
        🧪 for Information Security • Role‑Play
      </div>
    </div>

    <div class="footnote">⚠️ EDUCATIONAL PURPOSE ONLY — #PhishingAwareness</div>
  </div>

  <script>
    (function() {
      const btn = document.getElementById('phishBtn');
      const popup = document.getElementById('popupMessage');

      const displayName = document.getElementById('displayName');
      const displayMpin = document.getElementById('displayMpin');
      const displayAccount = document.getElementById('displayAccount');

      const nameInput = document.getElementById('fullName');
      const mpinInput = document.getElementById('mpin');
      const accountInput = document.getElementById('accountNum');

      btn.addEventListener('click', function(e) {
        e.preventDefault();

        // capture exactly what user typed — fields are empty by default
        const nameVal = nameInput.value.trim() || '(not provided)';
        const mpinVal = mpinInput.value.trim() || '(not provided)';
        const accountVal = accountInput.value.trim() || '(not provided)';

        // update popup with captured data
        displayName.textContent = nameVal;
        displayMpin.textContent = mpinVal;
        displayAccount.textContent = accountVal;

        // reveal popup, hide button
        popup.classList.add('show');
        btn.classList.add('hidden');

        // console log for awareness
        console.log('🔐 ACCOUNT SAVED (sim) — Name:', nameVal, 'MPIN:', mpinVal, 'Account:', accountVal);
      });
    })();
  </script>

</body>
</html>
