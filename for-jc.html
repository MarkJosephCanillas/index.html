<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para kay JC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            color: #4a4a4a;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #ff477e;
        }

        .btn {
            background-color: #ff477e;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.3);
        }

        .btn:hover {
            background-color: #ff0a54;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 10, 84, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .message {
            margin-top: 25px;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
            display: none;
        }

        .message.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .heart {
            color: #ff477e;
            font-size: 1.5rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hi!🙋‍♂️</h1>
        <button class="btn" id="clickBtn">Click me</button>
        <div class="message" id="secretMessage"></div>
    </div>

    <script>
        document.getElementById('clickBtn').addEventListener('click', function() {
            const messageDiv = document.getElementById('secretMessage');
            
            // Ang mensahe para kay JC
            messageDiv.innerHTML = `
                <strong>Hi JC!</strong> Cute mo, pakiss nga! JK Wehehehehehe <br>
                <div class="heart">✨ ❤️ ✨</div>
            `;
            
            // Ipapakita ang mensahe at itatago ang button
            messageDiv.classList.add('show');
            this.style.display = 'none';
        });
    </script>

</body>
</html>
