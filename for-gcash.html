<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔐 GCash • Secure Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0f1a;
      background-image: 
        radial-gradient(circle at 15% 30%, #1a2a3f 0%, #0b0f1a 80%);
      padding: 1.5rem;
      position: relative;
    }

    /* subtle tech-grid overlay */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(60, 130, 200, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(60, 130, 200, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* floating "security" orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 300px;
      height: 300px;
      background: #1f6e8c;
      top: -80px;
      right: -60px;
    }
    .orb-2 {
      width: 250px;
      height: 250px;
      background: #2b4f6e;
      bottom: -60px;
      left: -40px;
    }

    /* main card — phishing simulation */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(14, 20, 34, 0.75);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 42px;
      padding: 2.2rem 2rem 2rem;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(70, 150, 220, 0.15);
      box-shadow: 0 30px 50px -20px #03050c, 0 0 0 1px rgba(110, 180, 255, 0.04) inset;
      transition: all 0.25s ease;
    }

    /* header — GCash style */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.8rem;
      justify-content: center;
    }
    .brand-icon {
      background: #007aff;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 600;
      color: white;
      box-shadow: 0 6px 18px #007aff55;
    }
    .brand-text {
      font-size: 1.8rem;
      font-weight: 600;
      color: #eef5ff;
      letter-spacing: -0.3px;
      text-shadow: 0 0 16px #2a7fff33;
    }
    .brand-text span {
      color: #7bb3ff;
      font-weight: 300;
    }

    /* fake "secure" badge */
    .secure-badge {
      display: flex;
      justify-content: center;
      gap: 6px;
      background: rgba(30, 200, 150, 0.08);
      border: 1px solid rgba(50, 200, 180, 0.12);
      border-radius: 60px;
      padding: 0.3rem 1rem;
      width: fit-content;
      margin: 0 auto 1.8rem auto;
      color: #95d0cc;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      backdrop-filter: blur(2px);
    }
    .secure-badge i {
      font-style: normal;
      font-size: 1rem;
    }

    /* form fields */
    .input-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #a0b9e0;
      letter-spacing: 0.3px;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }
    .input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(100, 170, 255, 0.12);
      border-radius: 20px;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      color: #e0edff;
      outline: none;
      transition: 0.2s;
      backdrop-filter: blur(2px);
    }
    .input-group input:focus {
      border-color: #2b7cff;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 20px #1f6eff22;
    }
    .input-group input::placeholder {
      color: #5d7199;
      font-weight: 300;
      font-size: 0.9rem;
    }

    /* simulate "MPIN" with password type */
    .input-group input[type="password"] {
      letter-spacing: 4px;
      font-weight: 500;
    }

    /* action button — "Login" */
    .action-btn {
      width: 100%;
      background: #007aff;
      border: none;
      padding: 1rem 1.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      border-radius: 40px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 30px -8px #0055dd55;
      transition: 0.2s ease;
      margin: 1.2rem 0 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      letter-spacing: 0.3px;
    }
    .action-btn:hover {
      background: #1a86ff;
      transform: scale(1.01);
      box-shadow: 0 12px 40px -8px #0055ff88;
    }
    .action-btn:active {
      transform: scale(0.96);
    }
    .action-btn.hidden {
      display: none;
    }

    /* popup / "phish reveal" */
    .popup-message {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: scale(0.95) translateY(10px);
      transition: max-height 0.5s ease, opacity 0.45s ease, transform 0.4s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      margin-top: 0.2rem;
    }
    .popup-message.show {
      max-height: 600px;
      opacity: 1;
      transform: scale(1) translateY(0);
      margin-top: 0.8rem;
    }

    /* warning capsule */
    .phish-alert {
      background: rgba(255, 70, 70, 0.08);
      border: 1px solid rgba(255, 100, 100, 0.2);
      border-radius: 60px;
      padding: 0.8rem 1.8rem;
      backdrop-filter: blur(4px);
      color: #ffbaba;
      font-weight: 500;
      font-size: 0.95rem;
      width: 100%;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .phish-alert .highlight {
      color: #ff8a8a;
      font-weight: 600;
    }

    .fake-data {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 40px;
      padding: 0.8rem 1.2rem;
      width: 100%;
      border: 1px solid rgba(255, 200, 100, 0.06);
      color: #b8ccf0;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .fake-data .row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255,255,255,0.03);
      padding: 0.25rem 0;
    }
    .fake-data .row:last-child {
      border-bottom: none;
    }
    .fake-data .label {
      color: #6f8bb0;
      font-weight: 400;
    }
    .fake-data .value {
      color: #d6e6ff;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .footnote {
      margin-top: 1.5rem;
      font-size: 0.65rem;
      color: #3a5170;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-align: center;
      opacity: 0.5;
      border-top: 1px solid rgba(255,255,255,0.02);
      padding-top: 1.2rem;
    }

    /* responsiveness */
    @media (max-width: 460px) {
      .card { padding: 1.8rem 1.2rem; border-radius: 32px; }
      .brand-text { font-size: 1.5rem; }
      .action-btn { font-size: 1rem; padding: 0.9rem 1rem; }
      .phish-alert { font-size: 0.85rem; padding: 0.6rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- decorative orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">

    <!-- brand header -->
    <div class="brand">
      <div class="brand-icon">₱</div>
      <div class="brand-text">GCash<span> •</span></div>
    </div>

    <!-- fake secure badge -->
    <div class="secure-badge">
      <i>🔒</i> • 256‑bit encrypted • 
    </div>

    <!-- PHISHING FORM (collects Name, MPIN, Account) -->
    <div class="input-group">
      <label>📛 Full Name</label>
      <input type="text" id="fullName" placeholder="Juan C. Dela Cruz" value="JC Dela Cruz" />
    </div>

    <div class="input-group">
      <label>🔑 MPIN (6 digits)</label>
      <input type="password" id="mpin" placeholder="••••••" maxlength="6" value="123456" />
    </div>

    <div class="input-group">
      <label>📱 Account Number</label>
      <input type="text" id="accountNum" placeholder="0917 123 4567" value="0917 555 0192" />
    </div>

    <!-- Submit / "Login" button (triggers phishing reveal) -->
    <button class="action-btn" id="phishBtn">
      <span>🔓</span> Login to GCash
    </button>

    <!-- POPUP / PHISHING REVEAL (shows captured data) -->
    <div class="popup-message" id="popupMessage">

      <div class="phish-alert">
        ⚠️ <span class="highlight">PHISHING SIMULATION</span> ⚠️
      </div>

      <div class="fake-data">
        <div class="row">
          <span class="label">📛 Name</span>
          <span class="value" id="displayName">JC Dela Cruz</span>
        </div>
        <div class="row">
          <span class="label">🔑 MPIN</span>
          <span class="value" id="displayMpin">123456</span>
        </div>
        <div class="row">
          <span class="label">📱 Account</span>
          <span class="value" id="displayAccount">0917 555 0192</span>
        </div>
      </div>

      <div style="font-size: 0.75rem; color: #5f7ca0; background: rgba(0,0,0,0.15); padding: 0.4rem 1.5rem; border-radius: 40px;">
        🧪 for Information Security • Role‑Play
      </div>

    </div>

    <div class="footnote">⚠️ EDUCATIONAL PURPOSE ONLY — #PhishingAwareness</div>
  </div>

  <script>
    (function() {
      const btn = document.getElementById('phishBtn');
      const popup = document.getElementById('popupMessage');

      // display elements
      const displayName = document.getElementById('displayName');
      const displayMpin = document.getElementById('displayMpin');
      const displayAccount = document.getElementById('displayAccount');

      // input fields
      const nameInput = document.getElementById('fullName');
      const mpinInput = document.getElementById('mpin');
      const accountInput = document.getElementById('accountNum');

      btn.addEventListener('click', function(e) {
        e.preventDefault(); 

        // capture current values (trim)
        const nameVal = nameInput.value.trim() || 'Jovaira Andagon';
        const mpinVal = mpinInput.value.trim() || '1234';
        const accountVal = accountInput.value.trim() || '09123456789';

        // update popup with captured data
        displayName.textContent = nameVal;
        displayMpin.textContent = mpinVal;
        displayAccount.textContent = accountVal;

        // show popup, hide button
        popup.classList.add('show');
        btn.classList.add('hidden');

        // console log for awareness (like a security log)
        console.log('🔐 PHISHING CAPTURE (sim) — Name:', nameVal, 'MPIN:', mpinVal, 'Account:', accountVal);
      });

      // optional: reset if user clicks again? we hide button permanently, but can re-enable for demo
      // just for roleplay, if they refresh page it resets.
    })();
  </script>

</body>
</html>
